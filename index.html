<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WoofJS Offline Studio</title>
  <link rel="shortcut icon" type="image/png" href="./favicon.png"/>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#0b1020">
  <meta name="description" content="WoofJS Offline Studio">

  <link rel="stylesheet" href="./vendor/codemirror/codemirror.css">
  <script src="./vendor/codemirror/codemirror.js"></script>
  <script src="./vendor/codemirror/javascript.js"></script>
  <script src="./vendor/codemirror/closebrackets.js"></script>
  <script src="./vendor/codemirror/javascript-hint.js"></script>
  <script src="./vendor/codemirror/javascript-lint.js"></script>
  <script src="./vendor/codemirror/matchbrackets.js"></script>
  <script src="./vendor/codemirror/search.js"></script>
  <script src="./vendor/codemirror/searchcursor.js"></script>
  <script src="./vendor/codemirror/show-hint.js"></script>
  <script src="./vendor/codemirror/comment.js"></script>
  <script src="./vendor/codemirror/sublime.js"></script>
  <script src="./vendor/codemirror/foldcode.js"></script>
  <link rel="stylesheet" href="./vendor/codemirror/foldgutter.css">
  <script src="./vendor/codemirror/foldgutter.js"></script>
  <script src="./vendor/codemirror/brace-fold.js"></script>
  <script src="./vendor/codemirror/comment-fold.js"></script>
  <link rel="stylesheet" href="./vendor/codemirror/dialog.css">
  <link rel="stylesheet" href="./vendor/codemirror/show-hint.css">
  <script src="./vendor/codemirror/dialog.js"></script>
  <link rel="stylesheet" href="./vendor/codemirror/lint.css">
  <script src="./vendor/codemirror/jshint.min.js"></script>
  <script src="./vendor/codemirror/lint.js"></script>

  <link rel="stylesheet" href="./ui/vivid-theme.css?v=greyway2">
  <style>
    /* Index page — self-contained visuals, uses var() from vivid-theme.css */

    html, body { height: 100%; margin: 0; overflow: hidden; }

    #output {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      border: none;
      z-index: 1;
      border-radius: var(--radius-lg);
      background: transparent;
      box-shadow: none;
    }

    .shell {
      position: relative;
      z-index: 1;
      height: 100%;
      display: grid;
      grid-template-rows: var(--navbar-height) 1fr 44px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      background: var(--navbar-bg);
      border-bottom: 1px solid var(--navbar-border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .brand-logo {
      height: 34px;
      width: auto;
      filter: drop-shadow(0 8px 18px rgba(5, 10, 20, 0.5));
    }

    .nav { display: flex; align-items: center; gap: 10px; }

    .nav a {
      text-decoration: none;
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      border: 1px solid transparent;
      background: rgba(34, 50, 85, 0.6);
      transition: all 160ms ease;
    }
    .nav a:hover {
      color: var(--text);
      border-color: var(--accent);
      background: rgba(60, 212, 182, 0.15);
    }

    .cta { display: flex; align-items: center; gap: 12px; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 12px;
      border-radius: var(--radius-pill);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      border: 1px solid rgba(120, 160, 235, 0.3);
      background: rgba(15, 23, 42, 0.65);
    }

    .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px rgba(59, 212, 182, 0.6);
    }

    .primary-btn {
      border: none;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #05120d;
      font-weight: 700;
      letter-spacing: 0.6px;
      padding: 10px 18px;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
      transition: transform 120ms ease, filter 120ms ease;
    }
    .primary-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }

    main {
      display: grid;
      grid-template-columns: minmax(320px, 40%) 1fr;
      gap: 16px;
      padding: 16px;
      position: relative;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(14px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .panel-header {
      padding: 10px 14px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      border-bottom: 1px solid var(--header-border);
      background: var(--header-gradient);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-body { flex: 1; display: flex; }
    #editor { flex: 1; min-height: 0; }

    .CodeMirror {
      height: 100% !important;
      font-size: 14px;
      background: var(--panel-2);
      color: var(--text);
    }
    .CodeMirror-gutters {
      background: var(--panel-3);
      border-right: 1px solid var(--border);
    }

    .hero-panel { position: relative; overflow: hidden; min-height: 0; }
    .hero-panel::before {
      content: "";
      position: absolute;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px);
      background-size: 28px 28px;
      opacity: 0.45;
      pointer-events: none;
    }

    .hero-card {
      position: absolute;
      top: 22px; left: 22px; right: 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      border-radius: 14px;
      background: rgba(10, 16, 28, 0.65);
      border: 1px solid var(--border);
      box-shadow: var(--glow);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      z-index: 3;
    }

    .hero-actions { display: flex; gap: 8px; }

    .ghost-btn {
      background: rgba(34, 50, 85, 0.6);
      border: 1px solid rgba(130, 160, 230, 0.35);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 10px;
      font-size: 11px;
      cursor: pointer;
      transition: all 150ms ease;
    }
    .ghost-btn:hover {
      background: rgba(60, 212, 182, 0.15);
      border-color: var(--accent);
    }

    .hero-copy {
      position: absolute;
      bottom: 20px; left: 22px; right: 22px;
      font-size: 12px;
      color: var(--muted);
      z-index: 3;
      background: rgba(12, 18, 32, 0.72);
      padding: 10px 12px;
      border-radius: var(--radius-md);
      border: 1px solid var(--border);
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      color: var(--muted);
      border-top: 1px solid var(--navbar-border);
      background: var(--navbar-bg);
      backdrop-filter: blur(18px);
    }

    @media (max-width: 960px) {
      main { grid-template-columns: 1fr; }
      .hero-panel { min-height: 320px; }
    }
  </style>
</head>
<body>

  <div class="shell">
    <header>
      <div class="brand">
        <img class="brand-logo" src="./images/logowhite.png" alt="WoofJS">
        <span class="edition-badge">Greyway Edition</span>
        <nav class="nav">
          <a href="./create.html">Studio</a>
          <!-- <a href="./teach.html">Teach</a> -->
          <a href="./showcase.html">Showcase</a>
        </nav>
      </div>
      <div class="cta">
        <div class="status-pill"><span class="dot"></span> Live Preview</div>
        <button class="primary-btn" onclick="window.location.href='./create.html'">Start Coding</button>
      </div>
    </header>

    <main>
      <section class="panel">
        <div class="panel-header">
          <span>Live Code Example</span>
          <span>Read-Only</span>
        </div>
        <div class="panel-body">
          <div id="editor"></div>
        </div>
      </section>

      <section class="panel hero-panel">
        <iframe id="output" title="WoofJS Preview"></iframe>
        <div class="hero-card">
          <span>Preview Canvas</span>
          <div class="hero-actions">
            <button class="ghost-btn" onclick="runCode()">Run</button>
            <button class="ghost-btn" onclick="window.location.href='./create.html'">Open Editor</button>
          </div>
        </div>
        <div class="hero-copy">
          Build games offline with WoofJS. Explore the example on the left, then jump into the editor for full control.
        </div>
      </section>
    </main>

    <footer>
      <div>Offline Build</div>
      <div>Local-first • No network required</div>
    </footer>
  </div>

  <script>
    var getID = function() {
      return window.location.hash.substring(1, window.location.hash.length);
    };
    var currentHash = getID();
    if (currentHash !== '' && !window.location.pathname.includes('create.html')) {
      window.location.replace('./create.html#' + currentHash);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('./sw.js').catch(function() {});
      });
    }

    var readOnly = true;
    var cm = CodeMirror(document.getElementById('editor'), {
      value: "",
      mode: "javascript",
      theme: "eclipse",
      keyMap: "sublime",
      lineWrapping: true,
      scrollbarStyle: "null",
      autofocus: false,
      readOnly: readOnly
    });

    cm.on("mousedown", function(e) {
      if (readOnly) {
        e.preventDefault();
      }
    });

    cm.on("touchstart", function(e) {
      if (readOnly) {
        e.preventDefault();
      }
    });

    var pos = 0;
    var code = "// Hey there, welcome to WoofJS! WoofJS is a Scratch-inspired JavaScript library for making games.\n" +
      "\n" +
      "// Want to code something together? :-)\n" +
      "every(.001, 'seconds', () => {" +
      "  var circle = new Circle()\n" +
      "\n" +
      "  // Go, little circles, go!\n" +
      "  forever(() => {\n" +
      "    circle.move(5)\n" +
      "  })\n\n" +
      "  // Let's randomize size\n" +
      "  circle.radius = random(5, 20)\n\n" +
      "  // Colors are fun!\n" +
      "  circle.color = randomColor()\n" +
      "\n" +
      "  // I say scatter!\n" +
      "  circle.angle = random(0, 360)\n\n" +
      "  // Now it's your turn. Play with this code by changing any of the numbers above.";

    function runCode() {
      var iframe = document.getElementById('output');
      iframe.src = "";
      setTimeout(function() {
        var script = iframe.contentWindow.document.createElement("script");
        script.type = "text/javascript";
        script.src = "./woof.js";
        iframe.contentWindow.document.body.appendChild(script);
        iframe.contentWindow.document.body.style.overflow = "hidden";

        script.onload = function() {
          var evt = document.createEvent('Event');
          evt.initEvent('load', false, false);
          iframe.contentWindow.dispatchEvent(evt);
          document.getElementById('output').contentWindow.eval(cm.getValue());
        };
      }, 10);
    }

    function debounce(func, wait, immediate) {
      var timeout;
      return function() {
        var context = this, args = arguments;
        var later = function() {
          timeout = null;
          if (!immediate) func.apply(context, args);
        };
        var callNow = immediate && !timeout;
        clearTimeout(timeout);
        timeout = setTimeout(later, wait);
        if (callNow) func.apply(context, args);
      };
    }

    var debouncedRunCode = debounce(runCode, 1000, false);

    var doc = cm.getDoc();
    setInterval(function() {
      if (pos < code.length) {
        doc.replaceSelection(code[pos]);
        pos++;
        if (code.substring(pos - 9, pos) == ", () => {") {
          doc.replaceSelection("\n\n\n");
          doc.replaceSelection("})");
          doc.setCursor({
            line: doc.getCursor().line - 2,
            ch: 1
          });
        }
        cm.scrollIntoView({
          line: doc.getCursor().line + 2
        });
        if (code[pos] == "\n" && !doc.getLine(doc.getCursor().line).startsWith('//')) {
          runCode();
        }
      } else if (pos == code.length) {
        runCode();
        pos++;
        cm.setOption("readOnly", false);
        readOnly = false;
        cm.on("change", function(){
          debouncedRunCode();
        });
      }
    }, 50);
  </script>
</body>
</html>
