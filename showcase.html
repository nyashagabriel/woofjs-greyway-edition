<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Showcase — WoofJS Greyway Edition</title>
  <link rel="shortcut icon" type="image/png" href="./favicon.png"/>
  <meta name="theme-color" content="#0b1020">
  <link rel="stylesheet" href="./ui/vivid-theme.css?v=greyway3">
  <style>
    html, body { margin: 0; min-height: 100%; }

    .shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 20px; height: var(--navbar-height); flex-shrink: 0;
      background: var(--navbar-bg);
      border-bottom: 1px solid var(--navbar-border);
      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: 0.4px; }
    .brand-logo { height: 34px; width: auto; filter: drop-shadow(0 8px 18px rgba(5,10,20,0.5)); }
    .nav { display: flex; align-items: center; gap: 10px; }
    .nav a {
      text-decoration: none; color: var(--muted); font-size: 12px;
      text-transform: uppercase; letter-spacing: 1px; padding: 8px 14px;
      border-radius: var(--radius-sm); border: 1px solid transparent;
      background: rgba(34, 50, 85, 0.6); transition: all 160ms ease;
    }
    .nav a:hover {
      color: var(--text); border-color: var(--accent);
      background: rgba(60, 212, 182, 0.15);
    }
    .cta { display: flex; align-items: center; gap: 12px; }
    .primary-btn {
      border: none; background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #05120d; font-weight: 700; letter-spacing: 0.6px;
      padding: 10px 18px; border-radius: var(--radius-pill); cursor: pointer;
      box-shadow: 0 8px 20px rgba(34, 197, 94, 0.35);
      transition: transform 120ms ease, filter 120ms ease;
    }
    .primary-btn:hover { filter: brightness(1.06); transform: translateY(-1px); }

    .content { flex: 1; padding: 32px 24px 48px; max-width: 1200px; margin: 0 auto; width: 100%; }

    .section-label {
      font-size: 11px; text-transform: uppercase; letter-spacing: 2px;
      color: var(--muted); margin-bottom: 8px;
    }
    .section-title {
      font-size: 28px; font-weight: 700; color: var(--text); margin: 0 0 24px;
    }
    .section-title .accent { color: var(--accent); }

    .showcase-section { margin-bottom: 48px; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 20px;
    }

    .card {
      position: relative; border-radius: var(--radius-md); overflow: hidden;
      border: 1px solid var(--border);
      background: var(--panel);
      box-shadow: 0 8px 24px rgba(3, 8, 18, 0.35);
      transition: transform 180ms ease, box-shadow 180ms ease, border-color 180ms ease;
      cursor: pointer;
    }
    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 16px 40px rgba(3, 8, 18, 0.5);
      border-color: var(--accent);
    }
    .card a { text-decoration: none; color: inherit; display: block; }
    .card-img {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
      background: var(--bg-0);
    }
    .card-body {
      padding: 10px 12px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .card-title {
      font-size: 13px; font-weight: 600; color: var(--text);
      letter-spacing: 0.02em;
    }
    .card-arrow {
      font-size: 14px; color: var(--muted); transition: color 150ms ease;
    }
    .card:hover .card-arrow { color: var(--accent); }

    .tag {
      position: absolute; top: 8px; left: 8px;
      background: rgba(11, 16, 32, 0.75); backdrop-filter: blur(8px);
      border: 1px solid var(--border); border-radius: var(--radius-pill);
      padding: 3px 8px; font-size: 9px; text-transform: uppercase;
      letter-spacing: 1px; color: var(--accent-3);
    }

    .divider {
      height: 1px; background: var(--border); margin: 8px 0 40px;
    }

    footer {
      flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      padding: 0 18px; height: 44px;
      font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted);
    }

    @media (max-width: 600px) {
      .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 14px; }
      .content { padding: 20px 14px 32px; }
    }
  </style>
</head>
<body>
  <div class="shell">

    <header>
      <div class="brand">
        <img class="brand-logo" src="./images/logowhite.png" alt="WoofJS">
        <span class="edition-badge">Greyway Edition</span>
        <nav class="nav">
          <a href="./index.html">Home</a>
          <a href="./create.html">Studio</a>
          <!-- <a href="./teach.html">Teach</a> -->
          <a href="./showcase.html">Showcase</a>
        </nav>
      </div>
      <div class="cta">
        <button class="primary-btn" onclick="window.location.href='./create.html'">Start Coding</button>
      </div>
    </header>

    <div class="content">

      <section class="showcase-section">
        <div class="section-label">Creative</div>
        <h2 class="section-title"><span class="accent">Art</span> Showcase</h2>
        <div class="divider"></div>
        <div class="grid">
          <div class="card">
            <a href="./showcase/clock.html">
              <img class="card-img" src="./images/clock-screenshot.png" alt="Clock">
              <div class="card-body"><span class="card-title">Clock</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/fractal-trees.html">
              <img class="card-img" src="./images/fractal-trees-screenshot.png" alt="Fractal Trees">
              <div class="card-body"><span class="card-title">Fractal Trees</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/mandelbrot.html">
              <img class="card-img" src="./images/mandelbrot-screenshot.png" alt="Mandelbrot">
              <div class="card-body"><span class="card-title">Mandelbrot</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/matrix.html">
              <img class="card-img" src="./images/matrix-screenshot.gif" alt="Matrix">
              <div class="card-body"><span class="card-title">Matrix</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/waves.html">
              <img class="card-img" src="./images/waves-screenshot.gif" alt="Waves">
              <div class="card-body"><span class="card-title">Waves</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/trig-art.html">
              <img class="card-img" src="./images/trig-art-screenshot.png" alt="Trigonometry Art">
              <div class="card-body"><span class="card-title">Trig Art</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
        </div>
      </section>

      <section class="showcase-section">
        <div class="section-label">Interactive</div>
        <h2 class="section-title"><span class="accent">Game</span> Showcase</h2>
        <div class="divider"></div>
        <div class="grid">
          <div class="card">
            <a href="./showcase/3d-runner.html">
              <img class="card-img" src="./images/3d-runner-screenshot.png" alt="3D Runner">
              <div class="card-body"><span class="card-title">3D Runner</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/breakout.html">
              <span class="tag">Start Here</span>
              <img class="card-img" src="./images/breakout-screenshot.png" alt="Breakout">
              <div class="card-body"><span class="card-title">Breakout</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/color-picker.html">
              <img class="card-img" src="./images/color-picker-screenshot.png" alt="Color Picker">
              <div class="card-body"><span class="card-title">Color Picker</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/minesweeper.html">
              <img class="card-img" src="./images/minesweeper-screenshot.png" alt="Minesweeper">
              <div class="card-body"><span class="card-title">Minesweeper</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/set.html">
              <img class="card-img" src="./images/set-screenshot.png" alt="Set">
              <div class="card-body"><span class="card-title">Set</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/tetris.html">
              <img class="card-img" src="./images/tetris-screenshot.png" alt="Tetris">
              <div class="card-body"><span class="card-title">Tetris</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/orbital.html">
              <img class="card-img" src="./images/orbital-screenshot.png" alt="Orbital">
              <div class="card-body"><span class="card-title">Orbital</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/ttt-ai.html">
              <img class="card-img" src="./images/ttt-ai-screenshot.png" alt="Tic-Tac-Toe">
              <div class="card-body"><span class="card-title">Tic-Tac-Toe (AI)</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
          <div class="card">
            <a href="./showcase/typing.html">
              <img class="card-img" src="./images/typing-screenshot.png" alt="Typing Test">
              <div class="card-body"><span class="card-title">Typing Test</span><span class="card-arrow">&#8594;</span></div>
            </a>
          </div>
        </div>
      </section>

    </div>

    <footer>
      <div>WoofJS Greyway Edition &mdash; Showcase</div>
    </footer>

  </div>
</body>
</html>
